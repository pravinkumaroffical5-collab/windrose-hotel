<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Windrose Hotels — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#b4863c;--dark:#12203a;--gray:#6b6f7a;--line:#e4ded0;--bg:#faf7f0;--green:#188038;--red:#c0392b}*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,Arial,sans-serif}body{background:var(--bg);color:var(--dark)}header{background:#12203a;color:#f6f2ea;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #b4863c}header h1{font-size:20px;font-family:'Cormorant Garamond',serif;color:#d9b57a}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.login{max-width:400px;margin:60px auto}.card,.stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:0 4px 16px rgba(18,32,58,.05)}.card h2{margin-bottom:16px;font-family:'Cormorant Garamond',serif}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:bold;color:var(--gray);margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:5px}.btn{width:100%;background:var(--blue);color:#fff;border:0;padding:12px;border-radius:5px;font-weight:bold;cursor:pointer}.logout{background:none;border:1px solid #d9b57a;color:#d9b57a;padding:6px 10px;border-radius:4px;cursor:pointer}.stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}.stat-card{flex:1;min-width:150px}.num{font-size:26px;font-weight:600;font-family:'Cormorant Garamond',serif}.lbl{font-size:12px;color:var(--gray)}.table-wrap{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse;background:#fff;border:1px solid var(--line)}th,td{padding:12px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}th{background:#12203a;color:#d9b57a;font-size:11px;text-transform:uppercase}.badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold}.badge.pending{background:#fef7e0;color:#b06000}.badge.confirmed{background:#e8f0fe;color:var(--blue)}.badge.cancelled{background:#fce8e6;color:var(--red)}.cancel-btn{background:none;border:1px solid var(--red);color:var(--red);padding:5px 10px;border-radius:4px;cursor:pointer}.error{color:var(--red);font-size:13px;margin-top:10px}.empty{text-align:center;padding:40px;color:var(--gray)}
</style></head><body>
<header><h1>Windrose Hotels — Admin Dashboard</h1><div><span id="refreshTime" style="font-size:12px;color:#9ca3af;margin-right:10px"></span><button class="logout" id="logoutBtn" style="display:none">Logout</button></div></header>
<div id="loginView" class="login card"><h2>Admin Login</h2><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">Login</button><div id="loginError" class="error"></div></div>
<div id="dashboard" class="wrap" style="display:none"><div class="stats"><div class="stat-card"><div class="num" id="totalBookings">0</div><div class="lbl">Total Bookings</div></div><div class="stat-card"><div class="num" id="totalRevenue">₹0</div><div class="lbl">Revenue (Paid)</div></div><div class="stat-card"><div class="num" id="totalConfirmed">0</div><div class="lbl">Confirmed</div></div><div class="stat-card"><div class="num" id="totalCancelled">0</div><div class="lbl">Cancelled</div></div></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Room</th><th>Check In</th><th>Check Out</th><th>Guests</th><th>Amount</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="bookingsBody"></tbody></table></div><div id="emptyMsg" class="empty" style="display:none">No bookings yet.</div></div>
<script>
const tokenKey='windrose_admin_token';let token=localStorage.getItem(tokenKey);
const headers=()=>({Authorization:'Bearer '+token});
function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
async function login(){const username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;document.getElementById('loginError').textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');token=d.token;localStorage.setItem(tokenKey,token);showDashboard();}catch(e){document.getElementById('loginError').textContent=e.message}}
async function loadBookings(){try{const r=await fetch('/api/admin/bookings',{headers:headers()});if(r.status===401)return logout();const b=await r.json();renderStats(b);renderTable(b);document.getElementById('refreshTime').textContent='Updated '+new Date().toLocaleTimeString()}catch(e){console.error(e)}}
function renderStats(b){document.getElementById('totalBookings').textContent=b.length;document.getElementById('totalRevenue').textContent='₹'+b.filter(x=>x.paymentStatus==='paid').reduce((s,x)=>s+Number(x.totalPrice||0),0).toLocaleString('en-IN');document.getElementById('totalConfirmed').textContent=b.filter(x=>x.status==='confirmed').length;document.getElementById('totalCancelled').textContent=b.filter(x=>x.status==='cancelled').length}
function renderTable(b){const body=document.getElementById('bookingsBody');body.innerHTML='';document.getElementById('emptyMsg').style.display=b.length?'none':'block';b.forEach(x=>{const tr=document.createElement('tr');const cells=[`<td>${esc(x.customerName)}<br><span style="color:#9ca3af">${esc(x.email)}</span></td>`,`<td>${esc(x.roomType)}</td>`,`<td>${new Date(x.checkIn).toLocaleDateString()}</td>`,`<td>${new Date(x.checkOut).toLocaleDateString()}</td>`,`<td>${esc(x.guests)}</td>`,`<td>₹${Number(x.totalPrice||0).toLocaleString('en-IN')}</td>`,`<td><span class="badge ${esc(x.paymentStatus)}">${esc(x.paymentStatus)}</span><br><span style="font-size:11px;color:#9ca3af">${esc(x.paymentMethod||'')}</span></td>`,`<td><span class="badge ${esc(x.status)}">${esc(x.status)}</span></td>`,`<td>${x.status==='confirmed'?'<button class="cancel-btn">Cancel</button>':'—'}</td>`];tr.innerHTML=cells.join('');if(x.status==='confirmed')tr.querySelector('button').addEventListener('click',()=>cancelBooking(x._id));body.appendChild(tr)})}
async function cancelBooking(id){if(!confirm('Cancel this booking?'))return;const r=await fetch('/api/admin/bookings/'+encodeURIComponent(id)+'/cancel',{method:'PUT',headers:headers()});if(!r.ok){const d=await r.json().catch(()=>({}));return alert(d.error||'Failed to cancel booking')}loadBookings()}
function showDashboard(){document.getElementById('loginView').style.display='none';document.getElementById('dashboard').style.display='block';document.getElementById('logoutBtn').style.display='inline-block';loadBookings()}function logout(){token=null;localStorage.removeItem(tokenKey);document.getElementById('dashboard').style.display='none';document.getElementById('loginView').style.display='block';document.getElementById('logoutBtn').style.display='none'}
document.getElementById('loginBtn').onclick=login;document.getElementById('logoutBtn').onclick=logout;document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(token)showDashboard();setInterval(()=>{if(token)loadBookings()},8000);
</script></body></html>
