<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windrose Hotels — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--blue:#b4863c;--dark:#12203a;--gray:#6b6f7a;--line:#e4ded0;--bg:#faf7f0;--green:#188038;--red:#c0392b;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',Arial,sans-serif;}
  body{background:var(--bg);color:var(--dark);}
  header{background:#12203a;color:#f6f2ea;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #b4863c;}
  header h1{font-size:20px;font-family:'Cormorant Garamond',serif;font-weight:600;color:#d9b57a;}
  .wrap{max-width:1100px;margin:24px auto;padding:0 16px;}
  .stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;flex:1;min-width:150px;box-shadow:0 4px 16px rgba(18,32,58,0.05);}
  .stat-card .num{font-size:26px;font-weight:600;color:var(--dark);font-family:'Cormorant Garamond',serif;}
  .stat-card .lbl{font-size:12px;color:var(--gray);}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:0 4px 16px rgba(18,32,58,0.05);}
  th,td{padding:12px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);}
  th{background:#12203a;color:#d9b57a;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;}
  .badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;}
  .badge.paid{background:#e6f4ea;color:var(--green);}
  .badge.pending{background:#fef7e0;color:#b06000;}
  .badge.confirmed{background:#e8f0fe;color:var(--blue);}
  .badge.cancelled{background:#fce8e6;color:var(--red);}
  .cancel-btn{background:none;border:1px solid var(--red);color:var(--red);padding:5px 10px;border-radius:4px;font-size:12px;cursor:pointer;}
  .cancel-btn:hover{background:#fce8e6;}
  .empty{text-align:center;padding:40px;color:var(--gray);}
</style>
</head>
<body>

<header>
  <h1>Windrose Hotels — Admin Dashboard</h1>
  <span id="refreshTime" style="font-size:12px;color:#9ca3af;"></span>
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat-card"><div class="num" id="totalBookings">0</div><div class="lbl">Total Bookings</div></div>
    <div class="stat-card"><div class="num" id="totalRevenue">₹0</div><div class="lbl">Revenue (Paid)</div></div>
    <div class="stat-card"><div class="num" id="totalConfirmed">0</div><div class="lbl">Confirmed</div></div>
    <div class="stat-card"><div class="num" id="totalCancelled">0</div><div class="lbl">Cancelled</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Customer</th>
        <th>Room</th>
        <th>Check In</th>
        <th>Check Out</th>
        <th>Guests</th>
        <th>Amount</th>
        <th>Payment</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="bookingsBody"></tbody>
  </table>
  <div id="emptyMsg" class="empty" style="display:none;">No bookings yet.</div>
</div>

<script>
  const API_URL = 'https://windrose-hotel-1.onrender.com/api/bookings';

  async function loadBookings() {
    try {
      const res = await fetch(API_URL);
      const bookings = await res.json();
      renderStats(bookings);
      renderTable(bookings);
      document.getElementById('refreshTime').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (err) {
      console.error(err);
    }
  }

  function renderStats(bookings) {
    document.getElementById('totalBookings').textContent = bookings.length;
    const revenue = bookings.filter(b => b.paymentStatus === 'paid').reduce((sum, b) => sum + b.totalPrice, 0);
    document.getElementById('totalRevenue').textContent = '₹' + revenue.toLocaleString('en-IN');
    document.getElementById('totalConfirmed').textContent = bookings.filter(b => b.status === 'confirmed').length;
    document.getElementById('totalCancelled').textContent = bookings.filter(b => b.status === 'cancelled').length;
  }

  function renderTable(bookings) {
    const body = document.getElementById('bookingsBody');
    const emptyMsg = document.getElementById('emptyMsg');
    body.innerHTML = '';

    if (bookings.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    bookings.forEach(b => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${b.customerName}<br><span style="color:#9ca3af;">${b.email}</span></td>
        <td>${b.roomType}</td>
        <td>${new Date(b.checkIn).toLocaleDateString()}</td>
        <td>${new Date(b.checkOut).toLocaleDateString()}</td>
        <td>${b.guests}</td>
        <td>₹${b.totalPrice.toLocaleString('en-IN')}</td>
        <td><span class="badge ${b.paymentStatus}">${b.paymentStatus}</span><br><span style="font-size:11px;color:#9ca3af;">${b.paymentMethod || ''}</span></td>
        <td><span class="badge ${b.status}">${b.status}</span></td>
        <td>${b.status === 'confirmed' ? `<button class="cancel-btn" onclick="cancelBooking('${b._id}')">Cancel</button>` : '—'}</td>
      `;
      body.appendChild(tr);
    });
  }

  async function cancelBooking(id) {
    if (!confirm('Cancel this booking?')) return;
    try {
      await fetch(`${API_URL}/${id}/cancel`, { method: 'PUT' });
      loadBookings();
    } catch (err) {
      alert('Failed to cancel booking');
    }
  }

  loadBookings();
  setInterval(loadBookings, 8000); // auto refresh every 8s
</script>

</body>
</html>
